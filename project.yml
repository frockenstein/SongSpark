name: SongSpark
options:
  bundleIdPrefix: com.songspark
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  SwiftyDropbox:
    url: https://github.com/dropbox/SwiftyDropbox
    from: "10.0.0"

targets:
  SongSpark:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SongSpark
    resources:
      - SongSpark/Assets.xcassets
    info:
      path: SongSpark/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "SongSpark needs microphone access to record your musical ideas."
        NSLocationWhenInUseUsageDescription: "SongSpark stamps your recordings with GPS location."
        UIBackgroundModes:
          - audio
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        DropboxAppKey: "$(DROPBOX_APP_KEY)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "db-$(DROPBOX_APP_KEY)"
            CFBundleURLName: com.songspark.app.dropbox
        LSApplicationQueriesSchemes:
          - dbapi-2
          - dbapi-8-emm
    dependencies:
      - package: SwiftyDropbox
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.songspark.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SongSpark/Info.plist
